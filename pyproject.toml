[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-next"
version = "0.1.0"
description = "A minimal training stack for sub-1B next-generation language models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TabNahida" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pyarrow>=16.0",
  "tokenizers>=0.20",
  "torch>=2.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["tensorboard>=2.18"]

[project.scripts]
nanogpt-next-train = "nanogpt_next.train:main"
nanogpt-next-plot = "nanogpt_next.plotting:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
