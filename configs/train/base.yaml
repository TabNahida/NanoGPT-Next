seed: 1337
precision: bf16-mixed
accelerator: auto
devices: auto
num_nodes: 1
grad_accum_steps: 1
max_steps: 10000
log_every_n_steps: 10
val_check_interval: 500
gradient_clip_val: 1.0
enable_progress_bar: false
optimizer:
  name: moun_adamw
  lr: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
scheduler:
  name: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.1
checkpoint:
  save_top_k: 2
  every_n_train_steps: 500
  monitor: val/loss
  mode: min
